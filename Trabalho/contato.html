<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="Imagens/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <title>BooByte</title>
</head>
<body>
    <header>
        <div class="blocos">
            <div class="bloco1"></div>
            <div class="bloco2"></div>
            <div class="bloco3"></div>
            <div class="bloco4"></div>
        </div>
        <div class="cabeca">
            <a href="index.html"><img src="Imagens/logo.png" alt="Logotipo" width="80px"></a>
            <a href="index.html">BooByte</a>
        </div>
        <nav>
            <div>
                <ul class="menu">
                    <li><a href="index.html">Início</a></li>
                    <li><a href="jogos.html">Jogos</a></li>
                    <li><a href="sobre.html">Sobre</a></li>
                    <li><a href="contato.html">Contato</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <div class="inicio-contato">
            <h1>Entre em Contato</h1>
            <p>Preencha o formulário abaixo e entre em contato conosco.</p>
        </div>
        <div class="formulario">
            <form>
                <label for="nome">Nome:</label><br>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                <br>
                <label for="email">E-mail:</label><br>
                <input type="email" id="email" name="email" placeholder="exemplo@gmail.com" required>
                <br>
                <label for="telefone">Telefone:</label><br>
                <input type="tel" id="telefone" name="telefone" placeholder="00 00000-0000" required>
                <br>
                <label for="assunto">Assunto:</label><br>
                <select id="assunto" name="assunto" required>
                    <option value="">Selecione um assunto</option>
                    <option value="duvida">Dúvida</option>
                    <option value="compra">Compra</option>
                    <option value="pagamento">Pagamento</option>
                    <option value="suporte">Suporte</option>
                    <option value="outro">Outro</option>
                </select>
                <br>
                <label for="mensagem">Mensagem:</label><br>
                <textarea id="mensagem" name="mensagem" rows="6" cols="40"placeholder="Digite sua mensagem aqui..." required></textarea>
                <br>
                <div class="formulario-botao">
                    <input class="fbotao" type="submit" value="Enviar">
                    <input class="fbotao" type="reset" value="Limpar">
                </div>
            </form>
        </div>
    </main>
    <footer>
        <div class="direitos">
            <img src="Imagens/logo.png" alt="Logotipo" width="50px">
            <p>&copy 2026 BooByte. Todos os diretos reservados.</p>
        </div>
        <div class="redes">
            <a href="https://www.instagram.com" target="_blank"><img src="Imagens/instagram.png" alt="instagram" width="40px"></a>
            <a href="https://www.youtube.com" target="_blank"><img src="Imagens/youtube.png" alt="Youtube" width="40px"></a>
            <a href="https://x.com/home" target="_blank"><img src="Imagens/twitter.png" alt="Twitter" width="40px"></a>
        </div>
    </footer>
</body>
</html>
